# Fly.io: постоянный HTTPS-адрес вида https://<app>.fly.dev
# Деплой без GitHub: flyctl launch --no-deploy && flyctl deploy
app = "active-matter-maps"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
