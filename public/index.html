<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Active Matter · Интерактивные карты</title>
    <link rel="stylesheet" href="/styles.css?v=8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fa005a'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EAM%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="menu-btn" class="icon-btn" title="Панель">☰</button>
        <div class="brand">
          <span class="logo">AM</span>
          <div class="brand-text">
            <strong>Интерактивные карты</strong>
            <small>Active Matter</small>
          </div>
        </div>
        <div class="spacer"></div>
        <div id="user" class="user" hidden>
          <img id="user-avatar" alt="" />
          <span id="user-name"></span>
        </div>
      </header>

      <div id="body">
        <aside id="sidebar">
          <section class="panel">
            <h2>Локации <span id="map-count" class="badge">0</span></h2>
            <nav id="maplist" class="maplist"></nav>
          </section>

          <section class="panel" id="filters-panel" hidden>
            <h2>Уровень / режим</h2>
            <div id="filter-location" class="chips"></div>
            <div id="filter-mod" class="chips"></div>
          </section>

          <section class="panel">
            <h2>Слои</h2>
            <div id="layers" class="layers"></div>
          </section>

          <section class="panel">
            <h2>Поиск точек</h2>
            <input id="search" type="search" placeholder="Название точки…" autocomplete="off" />
            <div id="results" class="results"></div>
          </section>

          <section class="panel" id="peers-panel" hidden>
            <h2>В канале <span id="peer-count" class="badge">0</span></h2>
            <div id="peers" class="peers"></div>
          </section>

          <p class="attribution">
            Изображения карт и данные о точках —
            <a href="https://active-matter.fandom.com/ru/wiki/Служебная:AllMaps" target="_blank" rel="noreferrer">Active Matter Wiki</a>,
            лицензия CC-BY-SA.
          </p>
        </aside>

        <main id="stage">
          <div id="viewport">
            <canvas id="canvas"></canvas>
            <div id="cursors"></div>
            <div id="zlabels" class="zlabels"></div>
            <div id="pinlayer" class="pinlayer"></div>
            <div id="hitlayer" class="hitlayer"></div>
            <div id="tooltip" class="tooltip" hidden></div>
          </div>

          <div id="coord-readout" class="coord-readout">—</div>

          <div class="zoom-controls">
            <button data-act="zoom-in" title="Приблизить">+</button>
            <button data-act="zoom-out" title="Отдалить">−</button>
            <button data-act="reset" title="Сбросить вид">⤢</button>
            <button data-act="share" title="Скопировать ссылку на вид">🔗</button>
            <button data-act="fullscreen" title="Во весь экран">⛶</button>
          </div>

          <div id="loading" class="loading">Загрузка карты…</div>
          <div id="toast" class="toast" hidden></div>
        </main>
      </div>
    </div>

    <div id="popup" class="popup" hidden></div>

    <script type="module" src="/app.js?v=8"></script>
  </body>
</html>
